name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Bundle
        run: npm run build
      - name: Bundle is ES2018 (Chromium 69)
        run: npm run check:syntax
      - uses: actions/upload-artifact@v4
        with:
          name: aranplus-unsigned
          path: dist/
